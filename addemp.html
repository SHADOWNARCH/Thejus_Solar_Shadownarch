<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee | THEJUS SOLAR</title>
    <link rel="icon" type="image/png" href="Thejus logo.png" sizes="32x32">
    <link rel="icon" type="image/png" href="Thejus logo.png" sizes="16x16">
    <link rel="stylesheet" href="addempstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <nav class="page-nav">
        <div class="logo">
            <img src="Thejus solar logo wbg.png" alt="THEJUS Logo">
        </div>
        <a href="#" class="back-link" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Back to Manage Employees</a>
    </nav>

    <div class="form-container">
        <div class="form-card">
            <div class="card-header">
                <h2>Add New Employee</h2>
                <p>Create a new staff account for the portal.</p>
            </div>

            <form id="addEmpForm" action="#" class="employee-form" novalidate onsubmit="validateEmployeeForm(event)">
                
                <div class="form-section">
                    <h3><i class="fa-solid fa-id-badge"></i> Employee Details</h3>
                    
                    <div class="input-group">
                        <label for="empName">Full Name</label>
                        <div class="input-box">
                            <i class="fa-solid fa-user input-icon"></i>
                            <input type="text" id="empName" placeholder="Enter employee's full name" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="empEmail">Email Address</label>
                        <div class="input-box">
                            <i class="fa-solid fa-envelope input-icon"></i>
                            <input type="email" id="empEmail" placeholder="Enter employee's email address" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="empPhone">Phone Number</label>
                        <div class="input-box">
                            <i class="fa-solid fa-phone input-icon"></i>
                            <input type="tel" id="empPhone" placeholder="Enter employee's phone number" required>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3><i class="fa-solid fa-shield-halved"></i> Account Security</h3>

                    <div class="input-group">
                        <label for="empPass">Assign Password</label>
                        <div class="input-box">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="empPass" placeholder="Create a password" required>
                            <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('empPass', this)"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="empConfirmPass">Confirm Password</label>
                        <div class="input-box">
                            <i class="fa-solid fa-check-double input-icon"></i>
                            <input type="password" id="empConfirmPass" placeholder="Confirm the password" required>
                            <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('empConfirmPass', this)"></i>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="history.back()">Cancel</button>
                    <button type="submit" class="btn-submit" id="submitBtn">Add Employee</button>
                </div>

            </form>
        </div>
    </div>

    <div id="toastMsg" class="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBv2TXPVCcn8x1BnnSLS6Let7gW85ENobs",
            authDomain: "thejus-solar-shadownarch.firebaseapp.com",
            projectId: "thejus-solar-shadownarch",
            storageBucket: "thejus-solar-shadownarch.firebasestorage.app",
            messagingSenderId: "283255550760",
            appId: "1:283255550760:web:73aa595743c2aa8b3d561d"
        };

        // Initialize Primary App (for current Manager session)
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Initialize Secondary App (to create Employee without logging out Manager)
        const secondaryApp = initializeApp(firebaseConfig, "Secondary");
        const secondaryAuth = getAuth(secondaryApp);

        // --- UI FUNCTIONS ---
        window.togglePasswordVisibility = function(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                iconElement.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                iconElement.classList.replace("fa-eye-slash", "fa-eye");
            }
        };

        window.showToast = function(message, type = 'error') {
            const toast = document.getElementById("toastMsg");
            toast.style.backgroundColor = type === 'success' ? '#447c2e' : '#d93025';
            toast.style.borderLeft = type === 'success' ? '5px solid #2e541f' : '5px solid #a51f16';
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> ${message}`;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 3500);
        };

        // --- MAIN LOGIC ---
        window.validateEmployeeForm = async function(event) {
            event.preventDefault();
            
            const name = document.getElementById('empName').value.trim();
            const email = document.getElementById('empEmail').value.trim();
            const phone = document.getElementById('empPhone').value.trim();
            const pass = document.getElementById('empPass').value;
            const confirmPass = document.getElementById('empConfirmPass').value;
            const submitBtn = document.getElementById('submitBtn');

            // 1. Validations
            if (!name || !email || !phone || !pass || !confirmPass) return showToast("All fields are required.");
            if (pass.length < 6) return showToast("Password must be at least 6 characters.");
            if (pass !== confirmPass) return showToast("Passwords do not match.");

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = "Creating...";

                // 2. Create Employee Account using Secondary Auth
                const userCredential = await createUserWithEmailAndPassword(secondaryAuth, email, pass);
                const newEmp = userCredential.user;

                // 3. Store Employee Details in Firestore
                await setDoc(doc(db, "users", newEmp.uid), {
                    fullName: name,
                    email: email,
                    phone: phone,
                    role: "employee", // Hardcoded role
                    createdAt: new Date(),
                    createdBy: "manager"
                });

                // 4. Log out the secondary instance immediately so it doesn't interfere
                await signOut(secondaryAuth);

                showToast("Employee added successfully!", "success");
                setTimeout(() => { window.location.href = "manageemp.html"; }, 2000);

            } catch (error) {
                submitBtn.disabled = false;
                submitBtn.innerText = "Add Employee";
                showToast(error.message);
            }
        };
    </script>
</body>
</html>
