<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard | THEJUS SOLAR</title>
    <link rel="icon" type="image/png" href="Thejus logo.png">
    <link rel="stylesheet" href="custdashstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- Sidebar Container -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="Thejus solar logo wbg.png" alt="Logo" class="sidebar-logo">
            <button class="toggle-btn" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <ul class="nav-links">
            <li><a href="custdash.html" class="active"><i class="fa-solid fa-house-user"></i> <span>Dashboard</span></a></li>
            <li><a href="quogen1.html"><i class="fa-solid fa-file-invoice-dollar"></i><span>Generate Quotation</span></a></li>
            <li><a href="servicebook.html"><i class="fa-solid fa-calendar-check"></i> <span>Service Booking</span></a></li>
            <li><a href="mybookings.html"><i class="fa-solid fa-list-ul"></i> <span>My Bookings</span></a></li>
            <li><a href="rs.html"><i class="fa-solid fa-cart-shopping"></i> <span>Retail Store</span></a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">
        <header class="top-header">
            <div class="welcome-text">
                <h1><span>WELCOME TO THEJUS SOLAR</span></h1>
            </div>
            
            <div class="profile-section">
                <div class="profile-pic" onclick="toggleDropdown()">
                    <img id="userPic" src="https://via.placeholder.com/45" alt="Profile">
                </div>
                
                <div class="dropdown-menu" id="profileDropdown">
                     <a href="pp.html">
                        <i class="fa-solid fa-user-gear" style="color: #447c2e;"></i> Profile Personalization
                    </a>
                    <hr>
                    <a href="lorr.html" class="logout-link">
                        <i class="fa-solid fa-right-from-bracket"></i> Logout
                    </a>
                </div>
            </div>
        </header>

        <section class="dashboard-body">
            <!-- High-Color Navigation Grid -->
            <div class="stats-grid">
                <a href="quogen1.html" class="full-card teal-card">
                    <div class="stat-icon"><i class="fa-solid fa-file-invoice-dollar"></i></div>
                    <div class="stat-info">
                        <h3>Generate Quotation</h3>
                        <p class="stat-label">Genrate a free quote</p>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow-icon"></i>
                </a>

                <a href="servicebook.html" class="full-card orange-card">
                    <div class="stat-icon"><i class="fa-solid fa-calendar-check"></i></div>
                    <div class="stat-info">
                        <h3>Service Booking</h3>
                        <p class="stat-label">Schedule Maintenance</p>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow-icon"></i>
                </a>

                <a href="mybookings.html" class="full-card green-card">
                    <div class="stat-icon"><i class="fa-solid fa-list-ul"></i></div>
                    <div class="stat-info">
                        <h3>My Bookings</h3>
                        <p class="stat-label">View History & Status</p>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow-icon"></i>
                </a>

                <a href="rs.html" class="full-card teal-card">
                    <div class="stat-icon"><i class="fa-solid fa-cart-shopping"></i></div>
                    <div class="stat-info">
                        <h3>Retail Store</h3>
                        <p class="stat-label">Shop Solar Products</p>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow-icon"></i>
                </a>
            </div>
        </section>
    </main>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function toggleDropdown() {
            document.getElementById('profileDropdown').classList.toggle('show');
        }

        window.onclick = function(event) {
            if (!event.target.closest('.profile-section')) {
                const dropdown = document.getElementById('profileDropdown');
                if (dropdown && dropdown.classList.contains('show')) {
                    dropdown.classList.remove('show');
                }
            }
        }
    </script>
</body>
</html>
