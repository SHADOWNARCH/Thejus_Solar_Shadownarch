<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard | THEJUS SOLAR</title>
    <link rel="icon" type="image/png" href="Thejus logo.png">
    <link rel="stylesheet" href="custdashstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
    <script>(function(a){window.R=window.R||function(){(window.R.q=window.R.q||[]).push(Array.prototype.slice.call(arguments))};window.R.show=function(){window.R('show')};window.R.hide=function(){window.R('hide')};window.R.toggle=function(){window.R('toggle')};window.R.track=function(){window.R('track',Array.prototype.slice.call(arguments))};var o=function(){var s=document.createElement("script");s.src="https://cdn.robylon.ai/sdk/latest/chatbot.js";s.id="robylon-chatbot-sdk";s.onload=function(){if(a){window.RobylonChatbot.create({api_key:a})}};document.body.appendChild(s)};if(document.readyState==="complete"){o()}else{window.addEventListener("load",o)}})("1ac68972-c428-47c7-a489-bd5be440b3c9");</script>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="Thejus solar logo wbg.png" alt="Logo" class="sidebar-logo">
            <button class="toggle-btn" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <ul class="nav-links">
            <li><a href="custdash.html" class="active"><i class="fa-solid fa-house-user"></i> <span>Dashboard</span></a></li>
            <li><a href="quogen1.html"><i class="fa-solid fa-file-invoice-dollar"></i><span>Generate Quotation</span></a></li>
            <li><a href="servicebook.html"><i class="fa-solid fa-calendar-check"></i> <span>Service Booking</span></a></li>
            <li><a href="mybookings.html"><i class="fa-solid fa-list-ul"></i> <span>My Bookings</span></a></li>
            <li><a href="rs.html"><i class="fa-solid fa-cart-shopping"></i> <span>Retail Store</span></a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="top-header">
            <div class="welcome-text">
                <h1><span>WELCOME TO THEJUS SOLAR</span></h1>
                <p id="displayUserName" style="color: #447c2e; font-weight: bold; margin-left: 10px;"></p>
            </div>
            
            <div class="profile-section">
                <!-- Updated Profile Avatar Icon -->
                <div class="avatar" onclick="toggleDropdown()">
                    <i class="fa-solid fa-user"></i>
                </div>
                
                <div class="dropdown-menu" id="profileDropdown">
                     <a href="pp.html">
                        <i class="fa-solid fa-user-gear" style="color: #447c2e;"></i> Profile Personalization
                    </a>
                    <hr>
                    <a href="#" class="logout-link" onclick="handleLogout()">
                        <i class="fa-solid fa-right-from-bracket"></i> Logout
                    </a>
                </div>
            </div>
        </header>

        <section class="dashboard-body">
            <div class="stats-grid">
                <a href="quogen1.html" class="full-card teal-card">
                    <div class="stat-icon"><i class="fa-solid fa-file-invoice-dollar"></i></div>
                    <div class="stat-info">
                        <h3>Generate Quotation</h3>
                        <p class="stat-label">Generate a free quote</p>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow-icon"></i>
                </a>

                <a href="servicebook.html" class="full-card orange-card">
                    <div class="stat-icon"><i class="fa-solid fa-calendar-check"></i></div>
                    <div class="stat-info">
                        <h3>Service Booking</h3>
                        <p class="stat-label">Schedule Maintenance</p>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow-icon"></i>
                </a>

                <a href="mybookings.html" class="full-card green-card">
                    <div class="stat-icon"><i class="fa-solid fa-list-ul"></i></div>
                    <div class="stat-info">
                        <h3>My Bookings</h3>
                        <p class="stat-label">View History & Status</p>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow-icon"></i>
                </a>

                <a href="rs.html" class="full-card teal-card">
                    <div class="stat-icon"><i class="fa-solid fa-cart-shopping"></i></div>
                    <div class="stat-info">
                        <h3>Retail Store</h3>
                        <p class="stat-label">Shop Solar Products</p>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow-icon"></i>
                </a>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBv2TXPVCcn8x1BnnSLS6Let7gW85ENobs",
            authDomain: "thejus-solar-shadownarch.firebaseapp.com",
            projectId: "thejus-solar-shadownarch",
            storageBucket: "thejus-solar-shadownarch.firebasestorage.app",
            messagingSenderId: "283255550760",
            appId: "1:283255550760:web:73aa595743c2aa8b3d561d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    if (userData.role !== "customer") {
                        alert("Access Denied: Customers Only.");
                        window.location.href = "login.html";
                    } else {
                        document.getElementById('displayUserName').innerText = `Customer: ${userData.fullName}`;
                    }
                }
            } else {
                window.location.href = "login.html";
            }
        });

        window.handleLogout = function() {
            signOut(auth).then(() => { window.location.href = "login.html"; });
        };
    </script>

    <script>
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
        function toggleDropdown() { document.getElementById('profileDropdown').classList.toggle('show'); }
        window.onclick = function(event) {
            if (!event.target.closest('.profile-section')) {
                const dropdown = document.getElementById('profileDropdown');
                if (dropdown && dropdown.classList.contains('show')) dropdown.classList.remove('show');
            }
        }
    </script>
</body>
</html>
