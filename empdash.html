<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard | THEJUS SOLAR</title>
    <link rel="icon" type="image/png" href="Thejus logo.png">
    <link rel="stylesheet" href="empdashstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="Thejus solar logo wbg.png" alt="Logo" class="sidebar-logo">
            <button class="toggle-btn" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <ul class="nav-links">
            <li><a href="empdash.html" class="active"><i class="fa-solid fa-house-user"></i> <span>Dashboard</span></a></li>
            <li><a href="serappemp.html"><i class="fa-solid fa-briefcase"></i> <span>My Appointments</span></a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="top-header">
            <div class="welcome-text">
                <h1><span>WELCOME TO THEJUS SOLAR</span></h1>
                <p id="displayEmpName" style="color: #447c2e; font-weight: bold; margin-left: 10px;"></p>
            </div>
            
            <div class="profile-section">
                <div class="avatar" onclick="toggleDropdown()">
                    <i class="fa-solid fa-user"></i>
                </div>
                
                <div class="dropdown-menu" id="profileDropdown">
                    <a href="pp.html">
                        <i class="fa-solid fa-user-gear" style="color: #447c2e;"></i>  Profile Personalization
                    </a>
                    <hr>
                    <a href="#" class="logout-link" onclick="handleLogout()">
                        <i class="fa-solid fa-right-from-bracket"></i> Logout
                    </a>
                </div>
            </div>
        </header>

        <section class="dashboard-body">
            <div class="stats-grid">
                <a href="serappemp.html" class="full-card teal-card">
                    <div class="stat-icon"><i class="fa-solid fa-calendar-day"></i></div>
                    <div class="stat-info">
                        <h3>My Appointments</h3>
                        <p class="stat-label">View Allotted Work</p>
                    </div>
                    <i class="fa-solid fa-chevron-right arrow-icon"></i>
                </a>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBv2TXPVCcn8x1BnnSLS6Let7gW85ENobs",
            authDomain: "thejus-solar-shadownarch.firebaseapp.com",
            projectId: "thejus-solar-shadownarch",
            storageBucket: "thejus-solar-shadownarch.firebasestorage.app",
            messagingSenderId: "283255550760",
            appId: "1:283255550760:web:73aa595743c2aa8b3d561d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    if (userData.role !== "employee") {
                        alert("Access Denied: Employees Only.");
                        window.location.href = "login.html";
                    } else {
                        document.getElementById('displayEmpName').innerText = `Staff: ${userData.fullName}`;
                    }
                }
            } else {
                window.location.href = "login.html";
            }
        });

        window.handleLogout = function() {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            }).catch((error) => {
                console.error("Logout Error", error);
            });
        };
    </script>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function toggleDropdown() {
            document.getElementById('profileDropdown').classList.toggle('show');
        }

        window.onclick = function(event) {
            if (!event.target.closest('.profile-section')) {
                const dropdown = document.getElementById('profileDropdown');
                if (dropdown && dropdown.classList.contains('show')) {
                    dropdown.classList.remove('show');
                }
            }
        }
    </script>
</body>
</html>
