<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Employees | THEJUS SOLAR</title>
    <link rel="icon" type="image/png" href="Thejus logo.png" sizes="32x32">
    <link rel="icon" type="image/png" href="Thejus logo.png" sizes="16x16">
    <link rel="stylesheet" href="manageempstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <nav class="page-nav">
        <div class="logo">
            <img src="Thejus solar logo wbg.png" alt="THEJUS Logo">
        </div>
        <a href="managerdash.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
    </nav>

    <div class="hub-container">
        <div class="hub-header">
            <h2>Employee Management</h2>
            <p>Select an action below to manage your workforce.</p>
        </div>

        <div class="action-grid">
            <a href="addemp.html" class="action-card">
                <div class="icon-circle add-icon">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h3>Create New Employee</h3>
                <p>Register a new staff member and assign their login credentials.</p>
            </a>

            <a href="vedemp.html" class="action-card">
                <div class="icon-circle manage-icon">
                    <i class="fa-solid fa-users-gear"></i>
                </div>
                <h3>View / Edit / Delete</h3>
                <p>Manage existing employee records, update details, or remove accounts.</p>
            </a>
        </div>
    </div>

</body>
</html>
