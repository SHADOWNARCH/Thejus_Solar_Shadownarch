<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Quotations | THEJUS SOLAR</title>
    <link rel="icon" type="image/png" href="Thejus logo.png">
    <link rel="stylesheet" href="pendingquotationstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="Thejus solar logo wbg.png" alt="Logo" class="sidebar-logo">
            <button class="toggle-btn" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <ul class="nav-links">
            <li><a href="managerdash.html"><i class="fa-solid fa-house-user"></i> <span>Dashboard</span></a></li>
            <li><a href="quogen.html"><i class="fa-solid fa-file-invoice-dollar"></i> <span>Quotation Generation</span></a></li>
            <li><a href="pendingquotation.html" class="active"><i class="fa-solid fa-list-ul"></i> <span>Pending Quotations</span></a></li>
            <li><a href="serviceallotments.html"><i class="fa-solid fa-calendar-check"></i> <span>Service Allotments</span></a></li>
            <li><a href="inventory.html"><i class="fa-solid fa-warehouse"></i> <span>Inventory Management</span></a></li>
            <li><a href="purchasehistory.html"><i class="fa-solid fa-history"></i> <span>Purchase History</span></a></li>
            <li><a href="manageemp.html"><i class="fa-solid fa-users-gear"></i> <span>Manage Employees</span></a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="top-header">
            <div class="welcome-text">
                <h1><span>PENDING QUOTATION REQUESTS</span></h1>
            </div>
            <div class="profile-section">
                <div class="avatar" onclick="toggleDropdown()"><i class="fa-solid fa-user"></i></div>
                <div class="dropdown-menu" id="profileDropdown">
                     <a href="pp.html"><i class="fa-solid fa-user-gear"></i> Profile</a>
                    <hr>
                    <a href="lorr.html" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
                </div>
            </div>
        </header>

        <section class="dashboard-body">
            <div class="table-container">
                <table class="quote-table">
                    <thead>
                        <tr>
                            <th>Client Name</th>
                            <th>Contact Details</th>
                            <th>Site Location</th>
                            <th>Category</th>
                            <th>Capacity</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="quotationTableBody">
                        <tr><td colspan="7" style="text-align:center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBv2TXPVCcn8x1BnnSLS6Let7gW85ENobs",
            authDomain: "thejus-solar-shadownarch.firebaseapp.com",
            projectId: "thejus-solar-shadownarch",
            storageBucket: "thejus-solar-shadownarch.firebasestorage.app",
            messagingSenderId: "283255550760",
            appId: "1:283255550760:web:73aa595743c2aa8b3d561d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        onSnapshot(query(collection(db, "quotations"), orderBy("timestamp", "desc")), (snapshot) => {
            const tableBody = document.getElementById('quotationTableBody');
            let html = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const id = doc.id;
                const isPending = data.status === "Pending";
                const url = `quogen.html?docId=${id}&name=${encodeURIComponent(data.clientName)}&phone=${data.phone}&email=${data.email}&loc=${encodeURIComponent(data.location)}&cat=${data.category}&cap=${data.capacity}`;

                html += `
                    <tr>
                        <td><strong>${data.clientName}</strong></td>
                        <td>${data.phone}<br><small>${data.email}</small></td>
                        <td>${data.location}</td>
                        <td>${data.category}</td>
                        <td>${data.capacity} kWp</td>
                        <td><span class="status-badge ${isPending ? 'pending' : 'done'}">${data.status}</span></td>
                        <td>
                            ${isPending ? `<a href="${url}" class="btn-action">Generate</a>` : `<span style="color:green">Completed</span>`}
                        </td>
                    </tr>`;
            });
            tableBody.innerHTML = html || '<tr><td colspan="7">No records found.</td></tr>';
        });

        window.toggleSidebar = () => document.getElementById('sidebar').classList.toggle('collapsed');
        window.toggleDropdown = () => document.getElementById('profileDropdown').classList.toggle('show');
    </script>
</body>
</html>
