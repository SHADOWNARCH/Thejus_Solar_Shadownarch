<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Personalisation | THEJUS SOLAR</title>
    <link rel="icon" type="image/png" href="Thejus logo.png" sizes="32x32">
    <link rel="icon" type="image/png" href="Thejus logo.png" sizes="16x16">
    <link rel="stylesheet" href="ppstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <nav class="profile-nav">
        <div class="logo">
            <img src="Thejus solar logo wbg.png" alt="THEJUS Logo">
        </div>
        <a href="#" class="back-link" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
    </nav>

    <div class="profile-container">
        <div class="profile-card">
            <div class="card-header">
                <h2>Profile Personalisation</h2>
                <p>Update your personal details and account security.</p>
            </div>

            <form id="profileForm" class="profile-form" onsubmit="validateMainForm(event)">

                <div class="form-section">
                    <div class="section-header">
                        <h3><i class="fa-solid fa-address-card"></i> Personal Information</h3>
                        <button type="button" class="btn-edit" onclick="openEditModal()"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                    </div>
                    
                    <div class="input-group">
                        <label for="fullName">Full Name</label>
                        <div class="input-box">
                            <i class="fa-solid fa-user input-icon"></i>
                            <input type="text" id="fullName" value="Loading..." readonly>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <div class="input-box">
                            <i class="fa-solid fa-envelope input-icon"></i>
                            <input type="email" id="email" value="Loading..." readonly>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="phone">Phone Number</label>
                        <div class="input-box">
                            <i class="fa-solid fa-phone input-icon"></i>
                            <input type="tel" id="phone" value="Loading..." readonly>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3><i class="fa-solid fa-shield-halved"></i> Change Password</h3>
                    <p class="section-note">Leave blank if you do not wish to change your password.</p>

                    <div class="input-group">
                        <label for="currentPass">Current Password</label>
                        <div class="input-box">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="currentPass" placeholder="Enter current password">
                            <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('currentPass', this)"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="newPass">New Password</label>
                        <div class="input-box">
                            <i class="fa-solid fa-key input-icon"></i>
                            <input type="password" id="newPass" placeholder="Enter new password">
                            <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('newPass', this)"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="confirmPass">Confirm New Password</label>
                        <div class="input-box">
                            <i class="fa-solid fa-check-double input-icon"></i>
                            <input type="password" id="confirmPass" placeholder="Confirm new password">
                            <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('confirmPass', this)"></i>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="history.back()">Cancel</button>
                    <button type="submit" class="btn-save" id="saveBtn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <div id="customEditModal" class="modal-overlay">
        <div class="modal-card">
            <h3>Edit Personal Details</h3>
            <p>Update your registration information below.</p>

            <div class="input-group">
                <label>Full Name</label>
                <div class="input-box">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="modalName">
                </div>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" id="modalEmail" disabled title="Email change requires re-authentication">
                </div>
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <div class="input-box">
                    <i class="fa-solid fa-phone input-icon"></i>
                    <input type="tel" id="modalPhone">
                </div>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button type="button" class="btn-save" onclick="saveEditModal()">Confirm Details</button>
            </div>
        </div>
    </div>

    <div id="toastMsg" class="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, updatePassword, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBv2TXPVCcn8x1BnnSLS6Let7gW85ENobs",
            authDomain: "thejus-solar-shadownarch.firebaseapp.com",
            projectId: "thejus-solar-shadownarch",
            storageBucket: "thejus-solar-shadownarch.firebasestorage.app",
            messagingSenderId: "283255550760",
            appId: "1:283255550760:web:73aa595743c2aa8b3d561d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        // --- FETCH USER DATA ON LOAD ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    document.getElementById('fullName').value = data.fullName;
                    document.getElementById('email').value = data.email;
                    document.getElementById('phone').value = data.phone;
                }
            } else {
                window.location.href = "login.html";
            }
        });

        // --- SAVE PERSONAL INFO UPDATES ---
        window.saveEditModal = async function() {
            const name = document.getElementById('modalName').value.trim();
            const phone = document.getElementById('modalPhone').value.trim();

            if (!name || !phone) return showToast("Name and Phone are required.");

            try {
                await updateDoc(doc(db, "users", currentUser.uid), {
                    fullName: name,
                    phone: phone
                });
                
                document.getElementById('fullName').value = name;
                document.getElementById('phone').value = phone;
                
                showToast("Details updated locally. Save Changes to confirm.");
                closeEditModal();
            } catch (error) {
                showToast("Error updating: " + error.message);
            }
        };

        // --- MAIN FORM SUBMIT (PASSWORD CHANGE) ---
        window.validateMainForm = async function(event) {
            event.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            const currentPass = document.getElementById('currentPass').value;
            const newPass = document.getElementById('newPass').value;
            const confirmPass = document.getElementById('confirmPass').value;

            // Only proceed if user wants to change password
            if (newPass || currentPass || confirmPass) {
                if (!currentPass) return showToast("Current password required for change.");
                if (newPass !== confirmPass) return showToast("Passwords do not match.");
                if (newPass.length < 8) return showToast("New password must be 8+ characters.");

                try {
                    saveBtn.innerText = "Processing...";
                    saveBtn.disabled = true;

                    // Re-authenticate user before sensitive operation
                    const credential = EmailAuthProvider.credential(currentUser.email, currentPass);
                    await reauthenticateWithCredential(currentUser, credential);
                    
                    // Update Password in Auth
                    await updatePassword(currentUser, newPass);
                    showToast("Password updated successfully!");
                } catch (error) {
                    showToast("Auth Error: " + error.message);
                } finally {
                    saveBtn.innerText = "Save Changes";
                    saveBtn.disabled = false;
                }
            } else {
                showToast("Profile details are saved.");
            }
        };

        // UI Helpers
        window.showToast = function(message) {
            const toast = document.getElementById("toastMsg");
            toast.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${message}`;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 3500);
        };
    </script>

    <script>
        // --- UI NON-FIREBASE FUNCTIONS ---
        function togglePasswordVisibility(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                iconElement.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                iconElement.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        function openEditModal() {
            document.getElementById('modalName').value = document.getElementById('fullName').value;
            document.getElementById('modalEmail').value = document.getElementById('email').value;
            document.getElementById('modalPhone').value = document.getElementById('phone').value;
            document.getElementById('customEditModal').classList.add('show-modal');
        }

        function closeEditModal() {
            document.getElementById('customEditModal').classList.remove('show-modal');
        }
    </script>
</body>
</html>
