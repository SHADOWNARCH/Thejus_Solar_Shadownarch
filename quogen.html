<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUOTATION GENERATION | THEJUS SOLAR POWER SOLUTIONS</title>
    <link rel="icon" type="image/png" href="Thejus logo.png" sizes="32x32">
    <link rel="icon" type="image/png" href="Thejus logo.png" sizes="16x16">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        .top-back-btn{ position:absolute; top:20px; left:20px; background:#111; color:white; border:none; padding:10px 18px; font-size:14px; cursor:pointer; border-radius:4px; border:2px solid #f1c40f; z-index:100; }
        .top-back-btn:hover{ background:#f1c40f; color:black; }
        :root { --solar-orange: #f1c40f; --solar-green: #447c2e; }
        body { font-family: Arial, sans-serif; background-color: #e9ecef; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .form-container { background: white; padding: 40px; border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.2); width: 100%; max-width: 800px; }
        .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 30px; }
        .row { display: flex; gap: 20px; margin-bottom: 15px; }
        .col { flex: 1; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #999; font-size: 14px; box-sizing: border-box; }
        .btn-generate { width: 100%; background: #111; color: white; padding: 15px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; border: 2px solid var(--solar-orange); }
        .btn-generate:hover { background: var(--solar-orange); color: black; }
    </style>
</head>
<body>
<button class="top-back-btn" onclick="window.history.back()">⬅ Back</button>
<div class="form-container">
    <div class="header">
        <img src="Thejus solar logo wbg.png" alt="THEJUS Logo">
    </div>

    <div class="row">
        <div class="col"><label>Client Name</label><input type="text" id="name" placeholder="Full Name"></div>
        <div class="col"><label>Contact No.</label><input type="text" id="phone" placeholder="Phone Number"></div>
    </div>
    <div class="row">
        <div class="col"><label>Email Address</label><input type="email" id="email" placeholder="email@example.com"></div>
        <div class="col"><label>Site Location</label><input type="text" id="district" placeholder="City/District"></div>
    </div>
    <div class="row">
        <div class="col">
            <label>Installation Category</label>
            <select id="category">
                <option value="Residential">Residential</option>
                <option value="Commercial">Commercial</option>
                <option value="Industrial">Industrial</option>
                <option value="Off-Grid">Off-Grid</option>
            </select>
        </div>
        <div class="col">
            <label>System Capacity (kWp)</label>
            <input type="number" id="capacity" value="3" step="0.1">
        </div>
    </div>

    <hr style="margin: 30px 0; border: 1px solid #eee;">

    <h3>Material Specifications</h3>
    <table id="materialTable" style="width:100%; border-collapse: collapse; margin-bottom: 15px; font-size: 14px;">
        <thead>
            <tr style="background-color: #333; color: white; text-align: left;">
                <th style="padding: 10px; border: 1px solid #ddd;">Description</th>
                <th style="padding: 10px; border: 1px solid #ddd; width: 120px;">U/Price (₹)</th>
                <th style="padding: 10px; border: 1px solid #ddd; width: 80px;">Qty</th>
                <th style="padding: 10px; border: 1px solid #ddd; width: 120px;">Total</th>
                <th style="padding: 10px; border: 1px solid #ddd; width: 50px;"></th>
            </tr>
        </thead>
        <tbody id="materialBody"></tbody>
    </table>

    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button type="button" onclick="addRow()" style="background: #447c2e; color: white; padding: 10px 20px; border: none; cursor: pointer; border-radius: 4px;">+ Add Item</button>
        <button type="button" onclick="resetToDefault()" style="background: #666; color: white; padding: 10px 20px; border: none; cursor: pointer; border-radius: 4px;">Reset to 3kW Default</button>
    </div>

    <div class="row">
        <div class="col"><label>GST %</label><input type="number" id="gstRate" value="5" oninput="updateCalculations()"></div>
        <div class="col"><label>MNRE Subsidy (₹)</label><input type="number" id="subsidy" value="78000" oninput="updateCalculations()"></div>
    </div>

    <div style="text-align: right; background: #fdf7e3; padding: 20px; border: 1px solid #f1c40f;">
        <h3 id="grandTotalDisplay" style="margin: 0; color: #333;">Net Investment: ₹0.00</h3>
    </div>

    <button class="btn-generate" onclick="generateAndMarkComplete()">GENERATE QUOTATION</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBv2TXPVCcn8x1BnnSLS6Let7gW85ENobs",
        authDomain: "thejus-solar-shadownarch.firebaseapp.com",
        projectId: "thejus-solar-shadownarch",
        storageBucket: "thejus-solar-shadownarch.firebasestorage.app",
        messagingSenderId: "283255550760",
        appId: "1:283255550760:web:73aa595743c2aa8b3d561d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- PREFILL ON LOAD ---
    window.onload = function() {
        const p = new URLSearchParams(window.location.search);
        if (p.has('docId')) {
            document.getElementById('name').value = p.get('name');
            document.getElementById('phone').value = p.get('phone');
            document.getElementById('email').value = p.get('email');
            document.getElementById('district').value = p.get('loc');
            document.getElementById('category').value = p.get('cat');
            document.getElementById('capacity').value = p.get('cap');
        }
        resetToDefault();
    };

    // --- GENERATE & UPDATE DB ---
    window.generateAndMarkComplete = async function() {
        const p = new URLSearchParams(window.location.search);
        const docId = p.get('docId');

        if (docId) {
            try {
                const docRef = doc(db, "quotations", docId);
                await updateDoc(docRef, { status: "Completed" });
            } catch (e) { console.error("Error updating status:", e); }
        }
        // Run your existing PDF function
        generateExactPDF();
    };
</script>

<script>
    const { jsPDF } = window.jspdf;
    const thejusLogo = "data:image/png;base64,..."; // KEEP YOUR ORIGINAL LOGO STRING HERE

    const defaultItems = [
        { desc: "TOPCON Solar Modules 610/620 wp Bifacial", price: 19600, qty: 5 },
        { desc: "On Grid 3 Kw 1phase Inverter with wifi monitoring", price: 25000, qty: 1 },
        { desc: "Module mounting GP structure over open terrace", price: 5000, qty: 3 },
        { desc: "DCDB, IP66 protection with DC fuse, MCB & SPD for 1 ph", price: 3500, qty: 1 },
        { desc: "ACDB, IP66 protection with 1phase MCB & SPD", price: 3000, qty: 1 },
        { desc: "Solar DC cable 4sqmm KEI make", price: 72, qty: 50 },
        { desc: "AC cable wiring with 6sqmm cable", price: 80, qty: 30 },
        { desc: "40a 1Phase Isolator switch assembly", price: 1200, qty: 1 },
        { desc: "Earthing with chemical compound and chambers", price: 7000, qty: 1 },
        { desc: "Lightning arrestor with chemical compound earthing", price: 4000, qty: 1 },
        { desc: "3 feet cu bonded earth rod for earthing", price: 1700, qty: 3 },
        { desc: "PVC ISI Heavy duty conduits and accessories", price: 2000, qty: 1 },
        { desc: "PCR report and documentation", price: 2000, qty: 1 },
        { desc: "Unidirectional Solar Energy meter KSEB Certified", price: 4400, qty: 1 },
        { desc: "Structure fabrication and erection", price: 12000, qty: 1 },
        { desc: "Installation, testing and commissioning", price: 8000, qty: 1 }
    ];

    function addRow(item = { desc: "", price: 0, qty: 0 }) {
        const tbody = document.getElementById('materialBody');
        const row = tbody.insertRow();
        row.innerHTML = `
            <td><input type="text" class="item-desc" value="${item.desc}" style="width: 95%;"></td>
            <td><input type="number" class="item-price" value="${item.price}" oninput="updateCalculations()" style="width: 90%;"></td>
            <td><input type="number" class="item-qty" value="${item.qty}" oninput="updateCalculations()" style="width: 80%;"></td>
            <td class="item-total" style="text-align: right; font-weight: bold;">0.00</td>
            <td><button onclick="this.parentElement.parentElement.remove(); updateCalculations();" style="border:none; background:none; cursor:pointer;">❌</button></td>
        `;
        updateCalculations();
    }

    function updateCalculations() {
        let subtotal = 0;
        const rows = document.querySelectorAll('#materialBody tr');
        rows.forEach(row => {
            const p = parseFloat(row.querySelector('.item-price').value) || 0;
            const q = parseFloat(row.querySelector('.item-qty').value) || 0;
            const total = p * q;
            row.querySelector('.item-total').innerText = total.toLocaleString('en-IN', { minimumFractionDigits: 2 });
            subtotal += total;
        });
        const gst = (parseFloat(document.getElementById('gstRate').value) / 100) * subtotal;
        const subsidy = parseFloat(document.getElementById('subsidy').value) || 0;
        const net = (subtotal + gst) - subsidy;
        document.getElementById('grandTotalDisplay').innerText = `Net Investment: ₹${net.toLocaleString('en-IN', { minimumFractionDigits: 2 })}`;
        return { subtotal, gst, net, subsidy };
    }

    async function generateExactPDF() {
        const doc = new jsPDF();
        const data = updateCalculations();
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const email = document.getElementById('email').value;
        const district = document.getElementById('district').value;
        const category = document.getElementById('category').value;
        const capacity = document.getElementById('capacity').value;

        doc.addImage(thejusLogo, 'PNG', 70, 10, 70, 25);
        doc.setFontSize(8);
        doc.text("THEJASWAM, 47-1045D, Dhanya Junction, Chalikkavattom, Vennala Kochi - 682028", 105, 40, {align: "center"});
        doc.line(20, 43, 190, 43);
        doc.setFont("helvetica", "bold").setFontSize(14);
        doc.text("PROPOSAL & QUOTATION", 105, 55, {align: "center"});
        
        doc.autoTable({
            startY: 65,
            theme: 'grid',
            body: [
                ['Client Name', name, 'Contact No.', phone],
                ['Email Address', email, 'Site Location', district],
                ['Category', category, 'Capacity', capacity + " kWp"]
            ],
            styles: { fontSize: 9 }
        });

        const tableItems = [];
        document.querySelectorAll('#materialBody tr').forEach((row, index) => {
            tableItems.push([
                index + 1,
                row.querySelector('.item-desc').value,
                parseFloat(row.querySelector('.item-price').value).toFixed(2),
                row.querySelector('.item-qty').value,
                row.querySelector('.item-total').innerText
            ]);
        });

        doc.autoTable({
            startY: doc.lastAutoTable.finalY + 10,
            head: [['Sl', 'Description', 'U/Price', 'Qty', 'Amount']],
            body: tableItems,
            foot: [
                ['', '', '', 'Subtotal', data.subtotal.toLocaleString('en-IN')],
                ['', '', '', `GST (${document.getElementById('gstRate').value}%)`, data.gst.toLocaleString('en-IN')],
                ['', '', '', 'MNRE Subsidy', `-${data.subsidy.toLocaleString('en-IN')}`],
                ['', '', '', 'PROJECT COST', data.net.toLocaleString('en-IN')]
            ],
            headStyles: { fillColor: [68, 124, 46] }, 
            footStyles: { fillColor: [241, 196, 15], textColor: [0, 0, 0] } 
        });

        let finalY = doc.lastAutoTable.finalY + 15;
        doc.setFontSize(10).text("BANK ACCOUNT DETAILS:", 20, finalY);
        doc.setFont("helvetica", "normal");
        doc.text("A/C Name: THEJUS SOLAR POWER SOLUTIONS", 20, finalY + 6);
        doc.text("Bank: UNION BANK OF INDIA | A/C NO: 760501010050086", 20, finalY + 12);
        doc.text("Branch: CHAKKARAPARAMBU | IFSC: UBIN0576051", 20, finalY + 18);

        doc.save(`Quotation_${name || 'Solar'}.pdf`);
    }

    function resetToDefault() {
        document.getElementById('materialBody').innerHTML = "";
        defaultItems.forEach(item => addRow(item));
    }
</script>
</body>
</html>
