<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUOTATION GENERATION | THEJUS SOLAR POWER SOLUTIONS</title>
    <link rel="icon" type="image/png" href="Thejus logo.png" sizes="32x32">
    <link rel="icon" type="image/png" href="Thejus logo.png" sizes="16x16">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root { --solar-orange: #f1c40f; --solar-green: #447c2e; }
        body { font-family: Arial, sans-serif; background-color: #e9ecef; margin: 0; padding: 40px; display: flex; justify-content: center; }
        
        .top-back-btn {
            position: absolute; top: 20px; left: 20px; background: #111; color: white;
            border: 2px solid var(--solar-orange); padding: 10px 18px; font-size: 14px;
            cursor: pointer; border-radius: 4px; z-index: 100; transition: 0.3s;
        }
        .top-back-btn:hover { background: var(--solar-orange); color: black; }

        .form-container { background: white; padding: 40px; border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.2); width: 100%; max-width: 800px; }
        .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 30px; }
        .header img { max-width: 200px; }
        
        .row { display: flex; gap: 20px; margin-bottom: 15px; }
        .col { flex: 1; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #999; font-size: 14px; box-sizing: border-box; border-radius: 4px; }
        
        .btn-generate { 
            width: 100%; background: #111; color: white; padding: 15px; border: 2px solid var(--solar-orange);
            font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 16px; transition: 0.3s;
        }
        .btn-generate:hover { background: var(--solar-orange); color: black; }
        .btn-generate:disabled { background: #555; cursor: not-allowed; border-color: #555; }

        /* Toast Styles */
        .toast {
            visibility: hidden; min-width: 300px; background-color: #447c2e; color: #fff;
            text-align: center; border-radius: 8px; padding: 16px; position: fixed;
            z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%);
            font-size: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 3.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

<button class="top-back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i> Back</button>

<div class="form-container">
    <div class="header">
        <img src="Thejus solar logo wbg.png" alt="THEJUS Logo">
    </div>

    <div class="row">
        <div class="col"><label>Client Name</label><input type="text" id="name" placeholder="Enter your full name"></div>
        <div class="col"><label>Contact No.</label><input type="tel" id="phone" placeholder="10-digit number"></div>
    </div>
    <div class="row">
        <div class="col"><label>Email Address</label><input type="email" id="email" readonly></div>
        <div class="col"><label>Site Location (District)</label><input type="text" id="district" placeholder="e.g. Ernakulam"></div>
    </div>
    <div class="row">
        <div class="col">
            <label>Installation Category</label>
            <select id="type">
                <option value="RESIDENTIAL">RESIDENTIAL</option>
                <option value="COMMERCIAL">COMMERCIAL</option>
            </select>
        </div>
        <div class="col">
            <label>System Capacity</label>
            <select id="capacity">
                <option value="3">3 kWp</option>
                <option value="5">5 kWp</option>
                <option value="10">10 kWp</option>
                <option value="100">100 kWp</option>
            </select>
        </div>
    </div>

    <button class="btn-generate" id="submitBtn" onclick="submitQuotation()">GET A FREE QUOTE</button>
</div>

<div id="toastMsg" class="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBv2TXPVCcn8x1BnnSLS6Let7gW85ENobs",
        authDomain: "thejus-solar-shadownarch.firebaseapp.com",
        projectId: "thejus-solar-shadownarch",
        storageBucket: "thejus-solar-shadownarch.firebasestorage.app",
        messagingSenderId: "283255550760",
        appId: "1:283255550760:web:73aa595743c2aa8b3d561d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    // Check if user is logged in
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            document.getElementById('email').value = user.email; // Auto-fill email
        } else {
            window.location.href = "login.html"; // Redirect if not logged in
        }
    });

    window.goBack = () => window.history.back();

    // --- MAIN SUBMISSION LOGIC ---
    window.submitQuotation = async function() {
        const btn = document.getElementById('submitBtn');
        
        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value;
        const district = document.getElementById('district').value.trim();
        const type = document.getElementById('type').value;
        const cap = parseFloat(document.getElementById('capacity').value);

        // Validation
        if(!name || !phone || !district) {
            showToast("Please fill in all details.", false);
            return;
        }

        btn.innerText = "Submitting...";
        btn.disabled = true;

        try {
            // SAVE TO FIRESTORE
            await addDoc(collection(db, "quotations"), {
                customerUid: currentUser.uid,
                clientName: name,
                phone: phone,
                email: email,
                location: district,
                category: type,
                capacity: cap,
                status: "Pending", // For Manager visibility
                timestamp: new Date()
            });

            // SUCCESS TOAST
            showToast("Quotation placed, We will contact you shortly", true);
            
            // Clear inputs
            document.getElementById('name').value = "";
            document.getElementById('phone').value = "";
            document.getElementById('district').value = "";

        } catch (error) {
            console.error("Error:", error);
            showToast("Error: " + error.message, false);
        } finally {
            btn.innerText = "GET A FREE QUOTE";
            btn.disabled = false;
        }
    };

    function showToast(message, isSuccess) {
        const toast = document.getElementById("toastMsg");
        toast.style.backgroundColor = isSuccess ? "#447c2e" : "#d93025";
        toast.innerHTML = isSuccess ? `<i class="fa-solid fa-circle-check"></i> ${message}` : `<i class="fa-solid fa-circle-exclamation"></i> ${message}`;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 4000);
    }
</script>

</body>
</html>
