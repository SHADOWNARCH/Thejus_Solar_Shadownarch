<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | THEJUS SOLAR POWER SOLUTIONS</title>
    
    <link rel="icon" type="image/png" href="Thejus logo.png" sizes="32x32">
    <link rel="icon" type="image/png" href="Thejus logo.png" sizes="16x16">
    
    <link rel="stylesheet" href="registerstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <video autoplay muted loop playsinline class="bg-video">
        <source src="BG1.mp4" type="video/mp4">
    </video>

    <div class="glass-box">
        <img src="Thejus solar logo wbg.png" alt="Logo" class="logo">

        <h1>CREATE ACCOUNT</h1>
        <h3>Please register to continue</h3>

        <form id="regForm" action="#" class="form-box" novalidate onsubmit="validateRegisterForm(event)">

            <div class="input-box">
                <input type="text" id="regName" placeholder="Full Name" required>
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="input-box">
                <input type="email" id="regEmail" placeholder="Email Address" required>
                <i class="fa-solid fa-envelope"></i>
            </div>

            <div class="input-box">
                <input type="tel" id="regPhone" placeholder="Phone Number" required>
                <i class="fa-solid fa-phone"></i>
            </div>

            <div class="input-box">
                <input type="password" id="regPass" placeholder="Password" required>
                <i class="fa-solid fa-eye toggle-password" onclick="toggleVisibility('regPass', this)"></i>
            </div>

            <div class="input-box">
                <input type="password" id="confirmPass" placeholder="Confirm Password" required>
                <i class="fa-solid fa-eye toggle-password" onclick="toggleVisibility('confirmPass', this)"></i>
            </div>

            <button type="submit" class="btn">Register</button>

        </form>

        <p class="switch-page">
            Already have an account? 
            <a href="login.html">Login</a>
        </p>
    </div>

    <div id="toastMsg" class="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your specific Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBv2TXPVCcn8x1BnnSLS6Let7gW85ENobs",
            authDomain: "thejus-solar-shadownarch.firebaseapp.com",
            projectId: "thejus-solar-shadownarch",
            storageBucket: "thejus-solar-shadownarch.firebasestorage.app",
            messagingSenderId: "283255550760",
            appId: "1:283255550760:web:73aa595743c2aa8b3d561d"
        };

        // Initialize Services
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- UI FUNCTIONS ---
        window.toggleVisibility = function(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                iconElement.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                iconElement.classList.replace("fa-eye-slash", "fa-eye");
            }
        };

        window.showToast = function(message) {
            const toast = document.getElementById("toastMsg");
            toast.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${message}`;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 3500);
        };

        // --- MAIN REGISTRATION LOGIC ---
        window.validateRegisterForm = async function(event) {
            event.preventDefault(); 

            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const pass = document.getElementById('regPass').value;
            const confirm = document.getElementById('confirmPass').value;

            // 1. Basic Front-end Validation
            if (!name || !email || !phone || !pass || !confirm) return showToast("All fields are required.");
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) return showToast("Please enter a valid email address.");
            
            if (/\D/.test(phone) || phone.length !== 10) return showToast("Enter a valid 10-digit phone number.");

            const hasUppercase = /[A-Z]/.test(pass);
            const hasNumber = /[0-9]/.test(pass);
            const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(pass);
            if (pass.length < 8 || !hasUppercase || !hasNumber || !hasSpecial) {
                return showToast("Password needs 8+ chars, uppercase, number, and special character.");
            }

            if (pass !== confirm) return showToast("Passwords do not match.");

            try {
                // 2. Create User in Firebase Authentication
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                // 3. Save Name & Phone in Firestore Database
                await setDoc(doc(db, "users", user.uid), {
                    fullName: name,
                    email: email,
                    phone: phone,
                    role: "customer",
                    createdAt: new Date()
                });

                alert("Registration Successful! Please login to continue.");
                window.location.href = "login.html";

            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    showToast("This email is already registered.");
                } else {
                    showToast("Error: " + error.message);
                }
            }
        };
    </script>
</body>
</html>
