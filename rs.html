<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Store | THEJUS SOLAR</title>
    <link rel="icon" type="image/png" href="Thejus logo.png" sizes="32x32">
    <link rel="icon" type="image/png" href="Thejus logo.png" sizes="16x16">
    <link rel="stylesheet" href="rsstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <nav class="page-nav">
        <div class="logo">
            <img src="Thejus solar logo wbg.png" alt="THEJUS Logo">
        </div>
        <div class="nav-actions">
            <a href="#" class="back-link" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
            
            <div class="cart-nav-item" onclick="openCart()">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cartBadge" class="cart-badge">0</span>
            </div>
        </div>
    </nav>

    <header class="store-header">
        <h1>Retail Store</h1>
        <p>Premium solar solutions for a sustainable future.</p>
        <div class="header-line"></div>
    </header>

    <main class="store-container">
        <div class="product-grid" id="productGrid"></div>
    </main>

    <div id="productModalOverlay" class="modal-overlay" onclick="closeProductModal(event)">
        <div class="product-modal-card">
            <button class="modal-close-btn" onclick="closeProductModal(event, true)"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="product-modal-content">
                <div class="modal-gallery">
                    <div class="main-image">
                        <img id="modalMainImg" src="" alt="Product" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="img-placeholder"><i id="modalIcon" class="fa-solid fa-box"></i></div>
                    </div>
                    <div class="thumbnail-images" id="modalThumbs"></div>
                </div>

                <div class="modal-info">
                    <h2 id="modalTitle">Product Name</h2>
                    <p class="modal-price" id="modalPrice">₹0</p>
                    
                    <div class="modal-desc-box">
                        <h3>Description</h3>
                        <p id="modalDesc"></p>
                    </div>

                    <div class="modal-desc-box">
                        <h3>Specifications</h3>
                        <p id="modalDim"></p>
                    </div>

                    <div class="modal-action-row">
                        <div class="qty-control modal-qty-control">
                            <button type="button" class="qty-btn" onclick="updateQty('modal-qty', -1)">-</button>
                            <input type="number" id="modal-qty" class="qty-input" value="1" min="1" readonly>
                            <button type="button" class="qty-btn" onclick="updateQty('modal-qty', 1)">+</button>
                        </div>
                        <button class="btn-add-cart large-btn" id="modalAddBtn">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="cartOverlay" class="cart-overlay" onclick="closeCart()"></div>
    <div id="cartSidebar" class="cart-sidebar">
        <div class="cart-header">
            <h2><i class="fa-solid fa-cart-shopping"></i> Your Cart</h2>
            <button class="close-cart-btn" onclick="closeCart()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="cart-items" id="cartItemsList">
            <p class="empty-cart-msg">Your cart is currently empty.</p>
        </div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>Subtotal</span>
                <span id="cartTotalAmt">₹0</span>
            </div>
            <a href="payment.html" class="checkout-btn" id="checkoutBtn" style="pointer-events: none; opacity: 0.5;">Proceed to Checkout</a>
        </div>
    </div>

    <div id="toastMsg" class="toast"></div>

    <script>
        const productData = [
            { name: "Solar Panels 300W", price: 9000, desc: "High-efficiency 300W Mono-PERC solar panel.", dim: "1640mm x 992mm x 35mm | 18kg", icon: "fa-solar-panel", images: ["sp31.jpg", "sp32.jpg"] },
            { name: "Solar Panels 500W", price: 14000, desc: "Premium 500W Half-Cut cell solar panel.", dim: "2278mm x 1113mm x 35mm | 33kg", icon: "fa-solar-panel", images: ["sp51.jpg", "sp52.jpg"] },
            { name: "Lithium Battery", price: 19000, desc: "Advanced LiFePO4 battery with deep discharge.", dim: "480mm x 170mm x 240mm | 22kg", icon: "fa-car-battery", images: ["lb1.jpg", "lb2.jpg"] },
            { name: "On-Grid Inverter", price: 20000, desc: "Smart string inverter with Wi-Fi monitoring.", dim: "310mm x 543mm x 160mm | 11kg", icon: "fa-server", images: ["songi1.jpg", "songi2.jpg"] },
            { name: "Off-Grid Inverter", price: 23000, desc: "Robust off-grid inverter for power-cut areas.", dim: "350mm x 480mm x 180mm | 15kg", icon: "fa-server", images: ["sofgi1.jpg", "sofgi2.jpg"] },
            { name: "Hybrid Inverter", price: 25000, desc: "Hybrid inverter for Lithium-ion batteries.", dim: "400mm x 500mm x 200mm | 18kg", icon: "fa-car-battery", images: ["libi1.jpg", "libi2.jpg"] }
        ];

        function renderGrid() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = productData.map((p, i) => `
                <div class="product-card">
                    <div class="product-img" onclick="openProductModal(${i})">
                        <img src="${p.images[0]}" alt="${p.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="icon-fallback" style="display:none;"><i class="fa-solid ${p.icon}"></i></div>
                    </div>
                    <div class="product-details">
                        <h3 onclick="openProductModal(${i})">${p.name}</h3>
                        <p class="price">₹${p.price.toLocaleString('en-IN')}</p>
                        <div class="add-to-cart-row">
                            <div class="qty-control">
                                <button type="button" class="qty-btn" onclick="updateQty('grid-qty-${i}', -1)">-</button>
                                <input type="number" id="grid-qty-${i}" class="qty-input" value="1" min="1" readonly>
                                <button type="button" class="qty-btn" onclick="updateQty('grid-qty-${i}', 1)">+</button>
                            </div>
                            <button class="btn-add-cart" onclick="addFromGrid(${i})"><i class="fa-solid fa-cart-plus"></i> Add</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateQty(id, change) {
            const input = document.getElementById(id);
            input.value = Math.max(1, parseInt(input.value) + change);
        }

        function openProductModal(id) {
            const p = productData[id];
            document.getElementById('modalTitle').innerText = p.name;
            document.getElementById('modalPrice').innerText = "₹" + p.price.toLocaleString('en-IN');
            document.getElementById('modalDesc').innerText = p.desc;
            document.getElementById('modalDim').innerText = p.dim;
            document.getElementById('modal-qty').value = 1;
            
            const mainImg = document.getElementById('modalMainImg');
            mainImg.src = p.images[0];
            mainImg.style.display = 'block';
            document.getElementById('modalIcon').parentElement.style.display = 'none';

            const thumbs = document.getElementById('modalThumbs');
            thumbs.innerHTML = p.images.map(img => `
                <div class="thumb" onclick="switchModalImage('${img}')">
                    <img src="${img}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="thumb-icon-fallback" style="display:none;"><i class="fa-solid ${p.icon}"></i></div>
                </div>
            `).join('');

            document.getElementById('modalAddBtn').onclick = () => {
                addToCart(p.name, p.price, parseInt(document.getElementById('modal-qty').value));
                closeProductModal(null, true);
            };
            document.getElementById('productModalOverlay').classList.add('show');
        }

        function switchModalImage(src) {
            document.getElementById('modalMainImg').src = src;
        }

        function closeProductModal(e, force = false) {
            if (force || e.target.id === 'productModalOverlay') {
                document.getElementById('productModalOverlay').classList.remove('show');
            }
        }

        let cart = [];
        function addFromGrid(i) {
            const p = productData[i];
            const q = parseInt(document.getElementById(`grid-qty-${i}`).value);
            addToCart(p.name, p.price, q);
            document.getElementById(`grid-qty-${i}`).value = 1;
        }

        function addToCart(name, price, q) {
            const item = cart.find(x => x.name === name);
            if (item) item.qty += q; else cart.push({ name, price, qty: q });
            updateCartUI();
            showToast(`Added ${q}x ${name}`, "success");
        }

        function removeFromCart(i) {
            cart.splice(i, 1);
            updateCartUI();
        }

        function updateCartUI() {
            const list = document.getElementById('cartItemsList');
            const badge = document.getElementById('cartBadge');
            const total = document.getElementById('cartTotalAmt');
            const btn = document.getElementById('checkoutBtn');

            let count = 0, sum = 0;
            list.innerHTML = cart.length ? cart.map((item, i) => {
                count += item.qty;
                sum += (item.price * item.qty);
                return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${item.name}</h4>
                            <p>₹${item.price.toLocaleString('en-IN')} x ${item.qty}</p>
                        </div>
                        <div class="cart-item-actions">
                            <span class="item-total">₹${(item.price * item.qty).toLocaleString('en-IN')}</span>
                            <button onclick="removeFromCart(${i})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('') : '<p class="empty-cart-msg">Your cart is currently empty.</p>';

            badge.innerText = count;
            total.innerText = "₹" + sum.toLocaleString('en-IN');
            btn.style.pointerEvents = cart.length ? "auto" : "none";
            btn.style.opacity = cart.length ? "1" : "0.5";
        }

        function openCart() { document.getElementById('cartSidebar').classList.add('open'); document.getElementById('cartOverlay').classList.add('show'); }
        function closeCart() { document.getElementById('cartSidebar').classList.remove('open'); document.getElementById('cartOverlay').classList.remove('show'); }

        function showToast(msg, type = 'error') {
            const t = document.getElementById("toastMsg");
            t.innerHTML = `<i class="fa-solid ${type==='success'?'fa-circle-check':'fa-circle-exclamation'}"></i> ${msg}`;
            t.style.backgroundColor = type === 'success' ? '#447c2e' : '#d93025';
            t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 3500);
        }

        window.onload = renderGrid;
    </script>
</body>
</html>
