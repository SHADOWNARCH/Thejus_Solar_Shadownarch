<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Service Appointments | THEJUS SOLAR</title>
    <link rel="icon" type="image/png" href="Thejus logo.png">
    <link rel="stylesheet" href="serappempstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="Thejus solar logo wbg.png" alt="Logo" class="sidebar-logo">
            <button class="toggle-btn" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <ul class="nav-links">
            <li><a href="empdash.html"><i class="fa-solid fa-house-user"></i> <span>Dashboard</span></a></li>
            <li><a href="serappemp.html" class="active"><i class="fa-solid fa-briefcase"></i> <span>My Appointments</span></a></li>
        </ul>
    </nav>

    <main class="main-content">
        <header class="top-header">
            <div class="welcome-text">
                <h1><span>ALLOTTED SERVICES</span></h1>
            </div>
            
            <div class="profile-section">
                <div class="avatar" onclick="toggleDropdown()">
                    <img id="userPic" src="" alt="Profile" style="width:100%; height:100%; border-radius:50%; display:none; object-fit: cover;">
                    <i class="fa-solid fa-user" id="defaultUserIcon"></i>
                </div>
                
                <div class="dropdown-menu" id="profileDropdown">
                    <a href="pp.html"><i class="fa-solid fa-user-gear"></i> Profile</a>
                    <hr>
                    <a href="#" class="logout-link" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
                </div>
            </div>
        </header>

        <section class="dashboard-body">
            <div class="page-title">
                <h1>My Service Appointments</h1>
                <p>View your allotted tasks and update their completion status.</p>
            </div>

            <div class="table-container">
                <table class="service-table">
                    <thead>
                        <tr>
                            <th>Task ID</th>
                            <th>Customer Name</th>
                            <th>Contact & Address</th>
                            <th>Service Type</th>
                            <th>Scheduled Date</th>
                            <th>Update Status</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentTableBody">
                        <tr><td colspan="6" style="text-align:center; padding: 40px;">Loading your tasks...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="toastMsg" class="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBv2TXPVCcn8x1BnnSLS6Let7gW85ENobs",
            authDomain: "thejus-solar-shadownarch.firebaseapp.com",
            projectId: "thejus-solar-shadownarch",
            storageBucket: "thejus-solar-shadownarch.firebasestorage.app",
            messagingSenderId: "283255550760",
            appId: "1:283255550760:web:73aa595743c2aa8b3d561d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let employeeName = "";

        // 1. Auth Check & Identify Employee
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    employeeName = data.fullName;
                    
                    // Profile Pic
                    if(data.profilePic) {
                        const pic = document.getElementById('userPic');
                        pic.src = data.profilePic;
                        pic.style.display = 'block';
                        document.getElementById('defaultUserIcon').style.display = 'none';
                    }

                    loadMyAppointments(employeeName);
                }
            } else {
                window.location.href = "login.html";
            }
        });

        // 2. Load Appointments for THIS specific employee
        function loadMyAppointments(name) {
            const q = query(collection(db, "bookings"), where("technician", "==", name));
            
            onSnapshot(q, (snapshot) => {
                const tbody = document.getElementById('appointmentTableBody');
                let html = "";

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const id = doc.id;
                    const status = data.status || "Allotted";
                    
                    // Determine CSS class for status dropdown
                    let statusClass = "status-incomplete";
                    if(status === "In Progress") statusClass = "status-inprogress";
                    if(status === "Completed") statusClass = "status-completed";

                    html += `
                        <tr>
                            <td><strong>#${id.substring(0,6).toUpperCase()}</strong></td>
                            <td>${data.customerName}</td>
                            <td>
                                <i class="fa-solid fa-phone"></i> ${data.customerPhone}<br>
                                <i class="fa-solid fa-location-dot"></i> ${data.siteAddress}
                            </td>
                            <td>${data.serviceType}</td>
                            <td>${data.preferredDate}<br><small>${data.preferredTime}</small></td>
                            <td>
                                <select class="status-select ${statusClass}" onchange="updateTaskStatus('${id}', this)">
                                    <option value="Allotted" ${status === 'Allotted' ? 'selected' : ''}>Incomplete</option>
                                    <option value="In Progress" ${status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                    <option value="Completed" ${status === 'Completed' ? 'selected' : ''}>Completed</option>
                                </select>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html || '<tr><td colspan="6" style="text-align:center;">No appointments found for you.</td></tr>';
            });
        }

        // 3. Update Database Logic
        window.updateTaskStatus = async function(id, selectElement) {
            const newStatus = selectElement.value;
            try {
                await updateDoc(doc(db, "bookings", id), {
                    status: newStatus
                });
                
                showToast(`Task updated to ${newStatus}`, newStatus === 'Allotted' ? 'error' : 'success');
            } catch (error) {
                showToast("Update failed", "error");
            }
        };

        // UI Helpers
        window.handleLogout = () => signOut(auth).then(() => window.location.href = "login.html");
        window.toggleSidebar = () => document.getElementById('sidebar').classList.toggle('collapsed');
        window.toggleDropdown = () => document.getElementById('profileDropdown').classList.toggle('show');

        function showToast(message, type = 'success') {
            const toast = document.getElementById("toastMsg");
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> ${message}`;
            toast.style.backgroundColor = type === 'success' ? '#447c2e' : '#d93025';
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 3500);
        }
    </script>
</body>
</html>
