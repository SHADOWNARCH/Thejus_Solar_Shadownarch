<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Service | THEJUS SOLAR</title>
    <link rel="icon" type="image/png" href="Thejus logo.png">
    <link rel="stylesheet" href="servicebookstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img src="Thejus solar logo wbg.png" alt="Logo" class="sidebar-logo">
            <button class="toggle-btn" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        <ul class="nav-links">
            <li><a href="custdash.html"><i class="fa-solid fa-house-user"></i> <span>Dashboard</span></a></li>
            <li><a href="quogen1.html"><i class="fa-solid fa-file-invoice-dollar"></i><span>Generate Quotation</span></a></li>
            <li><a href="servicebook.html" class="active"><i class="fa-solid fa-calendar-check"></i> <span>Service Booking</span></a></li>
            <li><a href="mybookings.html"><i class="fa-solid fa-list-ul"></i> <span>My Bookings</span></a></li>
            <li><a href="rs.html"><i class="fa-solid fa-cart-shopping"></i> <span>Retail Store</span></a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <header class="top-header">
            <div class="welcome-text">
                <h1><span>BOOK A SERVICE</span></h1>
            </div>
            
            <div class="profile-section">
                <div class="avatar" onclick="toggleDropdown()">
                    <img id="userPic" src="" alt="Profile" style="width:100%; height:100%; border-radius:50%; display:none; object-fit: cover;">
                    <i class="fa-solid fa-user" id="defaultUserIcon"></i>
                </div>
                
                <div class="dropdown-menu" id="profileDropdown">
                     <a href="pp.html">
                        <i class="fa-solid fa-user-gear" style="color: #447c2e;"></i> Profile Personalization
                    </a>
                    <hr>
                    <a href="#" class="logout-link" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
                </div>
            </div>
        </header>

        <section class="dashboard-body">
            <div class="booking-container">
                <div class="form-card">
                    <div class="form-header">
                        <h2>Service Request Form</h2>
                        <p>Fill in the details below to schedule a maintenance visit.</p>
                    </div>
                    
                    <form id="serviceForm" class="booking-form" novalidate onsubmit="validateServiceForm(event)">
                        <!-- Contact Section -->
                        <div class="form-section">
                            <div class="section-title"><i class="fa-solid fa-id-card"></i> Contact Information</div>
                            <div class="input-grid">
                                <div class="input-group">
                                    <label>Full Name</label>
                                    <input type="text" id="custName" placeholder="Enter your name" required>
                                </div>
                                <div class="input-group">
                                    <label>Phone Number</label>
                                    <input type="tel" id="custPhone" placeholder="10-digit number" required>
                                </div>
                            </div>
                            <div class="input-group">
                                <label>Email Address</label>
                                <input type="email" id="custEmail" readonly style="background-color: #f9f9f9; color: #777;">
                            </div>
                            <div class="input-group">
                                <label>Site Address</label>
                                <textarea id="custAddress" rows="2" placeholder="Full location address of the solar plant" required></textarea>
                            </div>
                        </div>

                        <!-- Service Section -->
                        <div class="form-section">
                            <div class="section-title"><i class="fa-solid fa-toolbox"></i> Service Details</div>
                            <div class="input-group">
                                <label>Type of Service</label>
                                <select id="serviceType" required>
                                    <option value="">-- Choose Service --</option>
                                    <option value="Panel Washing">Panel Washing</option>
                                    <option value="Inverter Config">Inverter Connection Configuration</option>
                                    <option value="Dismantling">Panel Dismantling</option>
                                </select>
                            </div>
                            <div class="input-grid">
                                <div class="input-group">
                                    <label>Preferred Date</label>
                                    <input type="date" id="serviceDate" required>
                                </div>
                                <div class="input-group">
                                    <label>Preferred Time (09:00 - 18:00)</label>
                                    <input type="time" id="serviceTime" min="09:00" max="18:00" required>
                                </div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn-secondary" onclick="history.back()">Cancel</button>
                            <button type="submit" class="btn-primary" id="submitBtn">Confirm Booking</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div id="toastMsg" class="toast"></div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBv2TXPVCcn8x1BnnSLS6Let7gW85ENobs",
            authDomain: "thejus-solar-shadownarch.firebaseapp.com",
            projectId: "thejus-solar-shadownarch",
            storageBucket: "thejus-solar-shadownarch.firebasestorage.app",
            messagingSenderId: "283255550760",
            appId: "1:283255550760:web:73aa595743c2aa8b3d561d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        // 1. Check Auth and Fetch Profile
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    document.getElementById('custEmail').value = data.email;
                    if(data.profilePic) {
                        const pic = document.getElementById('userPic');
                        pic.src = data.profilePic;
                        pic.style.display = 'block';
                        document.getElementById('defaultUserIcon').style.display = 'none';
                    }
                }
            } else {
                window.location.href = "login.html";
            }
        });

        // 2. Form Submission & Validation
        window.validateServiceForm = async function(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();
            const service = document.getElementById('serviceType').value;
            const sDate = document.getElementById('serviceDate').value;
            const sTime = document.getElementById('serviceTime').value;

            // Basic Field Check
            if (!name || !phone || !address || !service || !sDate || !sTime) {
                return showToast("All fields are required.", "error");
            }

            // Phone Validation (10 Digits)
            if (phone.length !== 10 || /\D/.test(phone)) {
                return showToast("Phone number must be exactly 10 digits.", "error");
            }

            // Time Constraint Validation (09:00 - 18:00)
            if (sTime < "09:00" || sTime > "18:00") {
                return showToast("Please select a time between 09:00 and 18:00.", "error");
            }

            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                // Save to Firestore
                await addDoc(collection(db, "bookings"), {
                    customerUid: currentUser.uid,
                    customerName: name,
                    customerPhone: phone,
                    customerEmail: currentUser.email,
                    siteAddress: address,
                    serviceType: service,
                    preferredDate: sDate,
                    preferredTime: sTime,
                    status: "Pending",
                    timestamp: new Date()
                });

                showToast("Service Booking Request Sent, We will contact you shortly", "success");
                document.getElementById('serviceForm').reset();
                document.getElementById('custEmail').value = currentUser.email;

            } catch (error) {
                showToast("Booking failed: " + error.message, "error");
            } finally {
                btn.disabled = false;
                btn.innerText = "Confirm Booking";
            }
        };

        // UI Toggles
        window.handleLogout = () => signOut(auth).then(() => window.location.href = "login.html");
        window.toggleSidebar = () => document.getElementById('sidebar').classList.toggle('collapsed');
        window.toggleDropdown = () => document.getElementById('profileDropdown').classList.toggle('show');

        // Toast Logic
        function showToast(message, type) {
            const toast = document.getElementById("toastMsg");
            toast.style.backgroundColor = type === "success" ? "#447c2e" : "#d93025";
            toast.innerHTML = `<i class="fa-solid ${type === "success" ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> ${message}`;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 4000);
        }

        // Set date restriction (No past dates)
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('serviceDate').setAttribute('min', todayStr);
    </script>
    <script>(function(a){window.R=window.R||function(){(window.R.q=window.R.q||[]).push(Array.prototype.slice.call(arguments))};window.R.show=function(){window.R('show')};window.R.hide=function(){window.R('hide')};window.R.toggle=function(){window.R('toggle')};window.R.track=function(){window.R('track',Array.prototype.slice.call(arguments))};var o=function(){var s=document.createElement("script");s.src="https://cdn.robylon.ai/sdk/latest/chatbot.js";s.id="robylon-chatbot-sdk";s.onload=function(){if(a){window.RobylonChatbot.create({api_key:a})}};document.body.appendChild(s)};if(document.readyState==="complete"){o()}else{window.addEventListener("load",o)}})("1ac68972-c428-47c7-a489-bd5be440b3c9");</script>
</body>
</html>
